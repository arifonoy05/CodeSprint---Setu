# Answer key for the fixture SRS.
#
# Two independent things live here (D11):
#   requirements — the segmentation extraction is expected to produce
#   gaps         — what the four gap checks are expected to find
#
# Every gap names the assumption it rests on (D35). Overturning an assumption in
# ASSUMPTIONS.md changes only the entries tagged with it — grep, not rewrite.
#
# evidence ids come from the fixture corpus and must all exist: `npm run fixtures:check`
#
# EVIDENCE, AND WHY THERE ARE TWO LISTS
#
#   evidence_core  the one or two chunks originally authored — the most direct evidence
#   evidence       every chunk a BA would accept as showing this gap
#
# `evidence` is what the eval matches on. It is derived by ONE rule applied uniformly to
# all 30 gaps, not case by case:
#
#     the incident report that documents the gap,
#     the function that exhibits it,
#     and the table whose structure permits it
#     — whichever of those exist.
#
# Why this exists: measured strict recall was 0.53 against loose recall 0.87. The tool was
# finding the right gap on the right requirement and citing adjacent-but-legitimate
# evidence — a dependency evidenced by the incident describing its symptom rather than the
# table carrying it. A single "correct" citation per gap was too narrow a measuring
# instrument, not a fault in the finding.
#
# This widening was made AFTER seeing that result, which is exactly how one fools oneself.
# Hence: one uniform rule rather than judgement, evidence_core kept so the change is
# auditable, and BA sign-off required (see EVIDENCE-REVIEW.md) before any number derived
# from it is reported outside this repository.

requirements:
  - ref: REQ-001
    text: A loan officer shall be able to disburse an approved loan to the borrower in a single transaction.
    classification: functional
  - ref: REQ-002
    text: The system shall record each disbursement together with the reference returned by the core banking ledger.
    classification: functional
  - ref: REQ-003
    text: The system shall update the status of the loan to reflect that it has been disbursed.
    classification: functional
  - ref: REQ-004
    text: The system shall support partial disbursement in tranches against project milestones.
    classification: functional
  - ref: REQ-005
    text: The total value released across all tranches must never exceed the sanctioned principal.
    classification: business_rule
  - ref: REQ-006
    text: Once a loan has been disbursed the system shall generate the repayment schedule automatically, without officer intervention.
    classification: functional
  - ref: REQ-007
    text: The first installment shall fall due one month after disbursement.
    classification: business_rule
  - ref: REQ-008
    text: Installments shall be calculated on a reducing balance basis using the interest rate agreed at sanction.
    classification: business_rule
  - ref: REQ-009
    text: Where a loan is restructured, the schedule shall be regenerated to reflect the revised tenor.
    classification: functional
  - ref: REQ-010
    text: The system shall verify borrower eligibility immediately before funds are released, and not rely solely on checks performed at approval.
    classification: functional
  - ref: REQ-011
    text: Borrowers who have been blacklisted by the compliance team must not receive funds under any circumstances.
    classification: business_rule
  - ref: REQ-012
    text: The system shall enforce the single borrower exposure limit set out in the credit policy.
    classification: business_rule
  - ref: REQ-013
    text: The system shall provide a bulk disbursement facility so that an operations user can release payroll-backed loans together.
    classification: functional
  - ref: REQ-014
    text: Finance requires a daily disbursement report.
    classification: functional
  - ref: REQ-015
    text: Disbursement should complete quickly so that officers are not left waiting at the counter.
    classification: non_functional
  - ref: REQ-016
    text: All actions performed in the module must be auditable.
    classification: non_functional

# ---------------------------------------------------------------------------
# 30 planted gaps. No class below 6 (D18).
# ---------------------------------------------------------------------------
